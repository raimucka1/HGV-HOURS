<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo } = React;

/* Emoji-based icon shim (standalone version has no bundler for lucide-react) */
const mkIcon = (glyph) => function IconComp({ size = 16, color = 'currentColor', className = '', style = {} }) {
  return React.createElement('span', {
    className,
    style: { fontSize: size, lineHeight: 1, color, display: 'inline-block', filter: color ? 'none' : 'none', ...style }
  }, glyph);
};
const Truck = mkIcon('\uD83D\uDE9B');
const Coffee = mkIcon('\u2615');
const Wrench = mkIcon('\uD83D\uDD27');
const Hourglass = mkIcon('\u23F3');
const Moon = mkIcon('\uD83C\uDF19');
const BedDouble = mkIcon('\uD83D\uDECF\uFE0F');
const Power = mkIcon('\u23FB');
const MapPin = mkIcon('\uD83D\uDCCD');
const MapPinOff = mkIcon('\uD83D\uDCCD');
const AlertTriangle = mkIcon('\u26A0\uFE0F');
const CheckCircle2 = mkIcon('\u2705');
const Info = mkIcon('\u2139\uFE0F');
const SettingsIcon = mkIcon('\u2699\uFE0F');
const Calendar = mkIcon('\uD83D\uDCC5');
const X = mkIcon('\u2715');
const Download = mkIcon('\u2B07\uFE0F');
const Trash2 = mkIcon('\uD83D\uDDD1\uFE0F');
const Pencil = mkIcon('\u270E');
const ChevronRight = mkIcon('\u203A');
const ChevronLeft = mkIcon('\u2039');
const Gauge = mkIcon('\uD83D\uDD57');
const BookOpen = mkIcon('\uD83D\uDCD6');

/* localStorage-backed storage shim, mirroring the Claude artifact storage API
   (get/set/delete/list) so the rest of the app code needs no changes. */
const STORAGE_PREFIX = 'hgvhours:';
const storage = {
  async get(key) {
    const raw = localStorage.getItem(STORAGE_PREFIX + key);
    if (raw === null) throw new Error('not found');
    return { key, value: raw };
  },
  async set(key, value) {
    localStorage.setItem(STORAGE_PREFIX + key, value);
    return { key, value };
  },
  async delete(key) {
    localStorage.removeItem(STORAGE_PREFIX + key);
    return { key, deleted: true };
  },
  async list(prefix) {
    const p = STORAGE_PREFIX + (prefix || '');
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(p)) keys.push(k.slice(STORAGE_PREFIX.length));
    }
    return { keys };
  },
};

/* ------------------------------------------------------------------ */
/* Constants                                                           */
/* ------------------------------------------------------------------ */
const MIN = 60000, HOUR = 3600000, DAY = 24 * HOUR;

const RULES = {
  maxContinuousDriving: 4.5 * HOUR,
  breakRequired: 45 * MIN,
  splitBreakFirst: 15 * MIN,
  splitBreakSecond: 30 * MIN,
  dailyDriveNormal: 9 * HOUR,
  dailyDriveExtended: 10 * HOUR,
  maxExtendedDaysPerWeek: 2,
  weeklyDriveMax: 56 * HOUR,
  fortnightDriveMax: 90 * HOUR,
  dailyRestNormal: 11 * HOUR,
  dailyRestReducedMin: 9 * HOUR,
  maxReducedDailyRestsPerCycle: 3,
  splitRestFirstMin: 3 * HOUR,
  splitRestSecondMin: 9 * HOUR,
  weeklyRestNormal: 45 * HOUR,
  weeklyRestReducedMin: 24 * HOUR,
  weeklyRestDeadline: 144 * HOUR,
  wtdWeeklyAvg: 48 * HOUR,
  wtdWeeklyMax: 60 * HOUR,
  wtdNightMax: 10 * HOUR,
};

const META = {
  driving:     { label: 'Driving',                   short: 'Driving',     color: '#F5A623', icon: Truck },
  other_work:  { label: 'Other Work',                short: 'Other work',  color: '#45C4B0', icon: Wrench },
  poa:         { label: 'Period of Availability',    short: 'POA',         color: '#9B8CF2', icon: Hourglass },
  break:       { label: 'Break',                     short: 'Break',       color: '#3ECF6B', icon: Coffee },
  daily_rest:  { label: 'Daily Rest',                short: 'Daily rest',  color: '#4C8DFF', icon: Moon },
  weekly_rest: { label: 'Weekly Rest',                short: 'Weekly rest', color: '#2C56D6', icon: BedDouble },
  off:         { label: 'Off duty — not clocked on', short: 'Off',         color: '#5B6470', icon: Power },
};
const STATUS_GRID = ['driving', 'break', 'other_work', 'poa', 'daily_rest', 'weekly_rest'];

/* ------------------------------------------------------------------ */
/* Utils                                                               */
/* ------------------------------------------------------------------ */
const pad = n => String(n).padStart(2, '0');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const dateKey = t => { const d = new Date(t); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };

function fixedWeekStart(ms) {
  const d = new Date(ms);
  const day = (d.getDay() + 6) % 7; // Mon=0..Sun=6
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - day);
  return d.getTime();
}
function fmtHM(ms) {
  if (ms == null) return '—';
  const neg = ms < 0; ms = Math.abs(ms);
  const totalMin = Math.round(ms / MIN);
  const h = Math.floor(totalMin / 60), m = totalMin % 60;
  return (neg ? '-' : '') + h + 'h ' + pad(m) + 'm';
}
function fmtHMS(ms) {
  if (ms < 0) ms = 0;
  const s = Math.floor(ms / 1000);
  return pad(Math.floor(s / 3600)) + ':' + pad(Math.floor((s % 3600) / 60)) + ':' + pad(s % 60);
}
function fmtClock(t) { return new Date(t).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }); }
function fmtDate(t) { return new Date(t).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }); }
function fmtDateTime(t) { return fmtDate(t) + ', ' + fmtClock(t); }
function toLocalInput(iso) {
  const d = new Date(iso);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function fromLocalInput(v) { return new Date(v).toISOString(); }

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000, toRad = x => x * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}
function fallbackSpeed(last, pos, t) {
  if (!last) return 0;
  const dt = (t - last.t) / 1000; if (dt <= 0) return 0;
  return haversine(last.lat, last.lng, pos.coords.latitude, pos.coords.longitude) / dt;
}
function polar(cx, cy, r, deg) {
  const a = (deg - 90) * Math.PI / 180;
  return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
}
function arcPath(cx, cy, r, a0, a1) {
  if (a1 - a0 >= 359.99) { const mid = a0 + 180; return arcPath(cx, cy, r, a0, mid) + ' ' + arcPath(cx, cy, r, mid, a1); }
  const s = polar(cx, cy, r, a0), e = polar(cx, cy, r, a1);
  const large = a1 - a0 <= 180 ? 0 : 1;
  return `M ${s.x} ${s.y} A ${r} ${r} 0 ${large} 1 ${e.x} ${e.y}`;
}

/* ------------------------------------------------------------------ */
/* Compliance engine                                                   */
/* ------------------------------------------------------------------ */
function computeCompliance(rawSegments, now) {
  const withEnd = [...rawSegments]
    .sort((a, b) => new Date(a.start) - new Date(b.start))
    .map(s => ({ ...s, _start: new Date(s.start).getTime(), _end: s.end ? new Date(s.end).getTime() : now }));

  // classify daily rests (with split-rest pairing)
  const dailyRestSegs = withEnd.filter(s => s.status === 'daily_rest' && s.end);
  const consumed = new Set();
  const dailyRestClassified = [];
  for (let i = 0; i < dailyRestSegs.length; i++) {
    const a = dailyRestSegs[i];
    if (consumed.has(a.id)) continue;
    const aDur = a._end - a._start;
    if (aDur >= RULES.dailyRestNormal) { dailyRestClassified.push({ seg: a, cls: 'normal', dur: aDur }); continue; }
    if (aDur >= RULES.splitRestFirstMin) {
      let paired = false;
      for (let j = i + 1; j < dailyRestSegs.length; j++) {
        const b = dailyRestSegs[j];
        if (consumed.has(b.id)) continue;
        if (b._start - a._start > DAY) break;
        const bDur = b._end - b._start;
        if (bDur >= RULES.splitRestSecondMin && b._end - a._start <= DAY) {
          dailyRestClassified.push({ seg: a, cls: 'split', dur: b._end - a._start });
          consumed.add(a.id); consumed.add(b.id);
          paired = true; break;
        }
      }
      if (!paired) dailyRestClassified.push({ seg: a, cls: aDur >= RULES.dailyRestReducedMin ? 'reduced' : 'short', dur: aDur });
      continue;
    }
    dailyRestClassified.push({ seg: a, cls: 'short', dur: aDur });
  }

  // weekly rests
  const weeklyRestSegs = withEnd.filter(s => s.status === 'weekly_rest' && s.end).map(s => {
    const dur = s._end - s._start;
    const cls = dur >= RULES.weeklyRestNormal ? 'regular' : dur >= RULES.weeklyRestReducedMin ? 'reduced' : 'short';
    return { seg: s, dur, cls };
  });
  const qualifyingWR = weeklyRestSegs.filter(w => w.dur >= RULES.weeklyRestReducedMin);
  const lastWR = qualifyingWR.length ? qualifyingWR[qualifyingWR.length - 1] : null;
  const lastWeeklyRestEnd = lastWR ? lastWR.seg._end : null;
  const weeklyRestDeadline = lastWeeklyRestEnd != null ? lastWeeklyRestEnd + RULES.weeklyRestDeadline : null;

  let backToBackReduced = false;
  for (let i = 1; i < qualifyingWR.length; i++) if (qualifyingWR[i].cls === 'reduced' && qualifyingWR[i - 1].cls === 'reduced') backToBackReduced = true;

  const compOwed = qualifyingWR.filter(w => w.cls === 'reduced').map(w => {
    const weekStart = fixedWeekStart(w.seg._start);
    return { id: w.seg.id, date: w.seg._start, owedMs: RULES.weeklyRestNormal - w.dur, deadline: weekStart + 4 * 7 * DAY };
  });

  const sinceWR = lastWeeklyRestEnd ?? -Infinity;
  const reducedDailyCount = dailyRestClassified.filter(c => c.seg._start >= sinceWR && c.cls === 'reduced').length;
  const shortDailyRests = dailyRestClassified.filter(c => c.seg._start >= sinceWR && c.cls === 'short');

  // duty days, split at qualifying (>=9h) rest boundaries
  const boundaryIds = new Set(withEnd.filter(s => (s.status === 'daily_rest' || s.status === 'weekly_rest') && s.end && (s._end - s._start) >= RULES.dailyRestReducedMin).map(s => s.id));
  const dutyDays = [];
  let bucket = { segs: [] };
  for (const s of withEnd) {
    bucket.segs.push(s);
    if (boundaryIds.has(s.id)) { bucket.restAfter = s; dutyDays.push(bucket); bucket = { segs: [] }; }
  }
  dutyDays.push(bucket);

  const sumStatus = (segs, status) => segs.filter(s => s.status === status).reduce((sum, s) => sum + (s._end - s._start), 0);
  const dutyDaySummaries = dutyDays.map(d => ({
    start: d.segs.length ? d.segs[0]._start : null,
    driving: sumStatus(d.segs, 'driving'),
    otherWork: sumStatus(d.segs, 'other_work'),
    poa: sumStatus(d.segs, 'poa'),
    breakTotal: sumStatus(d.segs, 'break'),
    restAfter: d.restAfter || null,
    segs: d.segs,
  }));
  const currentDutyDay = dutyDaySummaries[dutyDaySummaries.length - 1];

  // continuous driving since last qualifying break, within current duty day
  let contDriving = 0, firstBreakPart = null;
  for (const s of currentDutyDay.segs) {
    const dur = s._end - s._start;
    if (s.status === 'driving') contDriving += dur;
    else if (s.status === 'break') {
      if (dur >= RULES.breakRequired) { contDriving = 0; firstBreakPart = null; }
      else if (!firstBreakPart && dur >= RULES.splitBreakFirst) firstBreakPart = s;
      else if (firstBreakPart && dur >= RULES.splitBreakSecond) { contDriving = 0; firstBreakPart = null; }
    }
  }

  const wkStart = fixedWeekStart(now), wkEnd = wkStart + 7 * DAY, prevWkStart = wkStart - 7 * DAY;
  const overlap = (rs, re, filterFn) => withEnd.filter(filterFn).reduce((sum, s) => sum + Math.max(0, Math.min(s._end, re) - Math.max(s._start, rs)), 0);
  const weekDriving = overlap(wkStart, wkEnd, s => s.status === 'driving');
  const prevWeekDriving = overlap(prevWkStart, wkStart, s => s.status === 'driving');
  const weekDuty = overlap(wkStart, wkEnd, s => s.status === 'driving' || s.status === 'other_work');
  const extendedDaysThisWeek = dutyDaySummaries.filter(d => d.start && d.start >= wkStart && d.start < wkEnd && d.driving > RULES.dailyDriveNormal).length;

  return {
    dailyRestClassified, weeklyRestSegs, qualifyingWR, lastWeeklyRestEnd, weeklyRestDeadline,
    backToBackReduced, compOwed, reducedDailyCount, shortDailyRests,
    dutyDaySummaries, currentDutyDay, contDriving,
    wkStart, wkEnd, weekDriving, fortnightDriving: weekDriving + prevWeekDriving, weekDuty, extendedDaysThisWeek,
  };
}

/* ------------------------------------------------------------------ */
/* Small UI pieces                                                     */
/* ------------------------------------------------------------------ */
function GaugeBar({ label, value, max, extra, color = '#F5A623', danger }) {
  const pct = Math.min(100, (value / max) * 100);
  const over = value > max;
  return (
    <div className="mb-3">
      <div className="flex justify-between items-baseline mb-1">
        <span className="text-xs text-[#8A93A0]">{label}</span>
        <span className="text-xs font-medium" style={{ fontFamily: "'JetBrains Mono',monospace", color: over ? '#FF5A5A' : '#ECEEF0' }}>
          {fmtHM(value)} <span className="text-[#5B6470]">/ {fmtHM(max)}</span>{extra ? ` · ${extra}` : ''}
        </span>
      </div>
      <div className="h-2 rounded-full bg-[#22262C] overflow-hidden">
        <div className="h-full rounded-full transition-all" style={{ width: pct + '%', backgroundColor: over || danger ? '#FF5A5A' : color }} />
      </div>
    </div>
  );
}

function Chip({ tone = 'default', children }) {
  const tones = {
    default: { bg: '#22262C', fg: '#ECEEF0' },
    green: { bg: 'rgba(62,207,107,0.15)', fg: '#3ECF6B' },
    amber: { bg: 'rgba(245,166,35,0.15)', fg: '#F5A623' },
    red: { bg: 'rgba(255,90,90,0.15)', fg: '#FF5A5A' },
    blue: { bg: 'rgba(76,141,255,0.15)', fg: '#4C8DFF' },
  };
  const t = tones[tone];
  return <span className="inline-block px-2 py-1 rounded-md text-xs font-medium" style={{ background: t.bg, color: t.fg }}>{children}</span>;
}

function Dial({ segments, dayStart, isToday, now }) {
  const dayEnd = dayStart + DAY;
  const CX = 130, CY = 130, R = 92, STROKE = 24;
  const clipped = segments
    .map(s => ({ ...s, cs: Math.max(s._start, dayStart), ce: Math.min(s._end, dayEnd) }))
    .filter(s => s.ce > s.cs);
  const nowAngle = ((Math.min(now, dayEnd) - dayStart) / DAY) * 360;

  return (
    <svg viewBox="0 0 260 260" className="w-full max-w-[260px] mx-auto">
      <circle cx={CX} cy={CY} r={R} stroke="#22262C" strokeWidth={STROKE} fill="none" />
      {clipped.map(s => (
        <path key={s.id} d={arcPath(CX, CY, R, ((s.cs - dayStart) / DAY) * 360, ((s.ce - dayStart) / DAY) * 360)}
          stroke={META[s.status]?.color || '#5B6470'} strokeWidth={STROKE} fill="none" strokeLinecap="butt" />
      ))}
      {[0, 3, 6, 9, 12, 15, 18, 21].map(h => {
        const p1 = polar(CX, CY, R + STROKE / 2 + 2, h / 24 * 360);
        const p2 = polar(CX, CY, R + STROKE / 2 + 8, h / 24 * 360);
        const lp = polar(CX, CY, R + STROKE / 2 + 20, h / 24 * 360);
        return (
          <g key={h}>
            <line x1={p1.x} y1={p1.y} x2={p2.x} y2={p2.y} stroke="#3A4048" strokeWidth={1.5} />
            <text x={lp.x} y={lp.y} fill="#5B6470" fontSize="9" textAnchor="middle" dominantBaseline="middle" fontFamily="'JetBrains Mono',monospace">{pad(h)}</text>
          </g>
        );
      })}
      {isToday && (() => { const p = polar(CX, CY, R + STROKE / 2 + 2, nowAngle); return <circle cx={p.x} cy={p.y} r={4} fill="#ECEEF0" />; })()}
      <circle cx={CX} cy={CY} r={R - STROKE / 2 - 6} fill="#14171A" />
    </svg>
  );
}

/* ------------------------------------------------------------------ */
/* Stop-classification modal                                           */
/* ------------------------------------------------------------------ */
function StopPromptModal({ since, now, onChoose, onDismiss }) {
  return (
    <div className="fixed inset-0 bg-black/70 flex items-end sm:items-center justify-center z-50 p-4">
      <div className="bg-[#1B1F24] border border-[#2A2F36] rounded-2xl w-full max-w-sm p-5">
        <div className="flex items-center gap-2 mb-1">
          <AlertTriangle size={18} color="#F5A623" />
          <h3 className="text-[#ECEEF0] font-semibold" style={{ fontFamily: "'Oswald',sans-serif" }}>You've stopped</h3>
        </div>
        <p className="text-sm text-[#8A93A0] mb-4">No movement for {fmtHM(now - since)}. What's happening now? (Logged from {fmtClock(since)}.)</p>
        <div className="grid grid-cols-2 gap-2 mb-2">
          {['break', 'other_work', 'poa', 'daily_rest', 'weekly_rest'].map(st => {
            const Icon = META[st].icon;
            return (
              <button key={st} onClick={() => onChoose(st)}
                className="flex items-center gap-2 px-3 py-2.5 rounded-xl border border-[#2A2F36] text-[#ECEEF0] text-sm active:scale-95 transition"
                style={{ backgroundColor: '#22262C' }}>
                <Icon size={16} color={META[st].color} /> {META[st].short}
              </button>
            );
          })}
        </div>
        <button onClick={onDismiss} className="w-full mt-2 py-2 text-sm text-[#8A93A0] rounded-xl border border-[#2A2F36]">Still driving (false alarm)</button>
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* Edit entry modal                                                    */
/* ------------------------------------------------------------------ */
function EditEntryModal({ entry, onSave, onDelete, onClose }) {
  const [status, setStatus] = useState(entry.status);
  const [start, setStart] = useState(toLocalInput(entry.start));
  const [end, setEnd] = useState(entry.end ? toLocalInput(entry.end) : '');
  return (
    <div className="fixed inset-0 bg-black/70 flex items-end sm:items-center justify-center z-50 p-4">
      <div className="bg-[#1B1F24] border border-[#2A2F36] rounded-2xl w-full max-w-sm p-5">
        <div className="flex items-center justify-between mb-4">
          <h3 className="text-[#ECEEF0] font-semibold" style={{ fontFamily: "'Oswald',sans-serif" }}>Edit entry</h3>
          <button onClick={onClose}><X size={18} color="#8A93A0" /></button>
        </div>
        <label className="text-xs text-[#8A93A0]">Status</label>
        <select value={status} onChange={e => setStatus(e.target.value)}
          className="w-full mt-1 mb-3 bg-[#22262C] border border-[#2A2F36] rounded-lg px-3 py-2 text-[#ECEEF0] text-sm">
          {STATUS_GRID.map(s => <option key={s} value={s}>{META[s].label}</option>)}
        </select>
        <label className="text-xs text-[#8A93A0]">Start</label>
        <input type="datetime-local" value={start} onChange={e => setStart(e.target.value)}
          className="w-full mt-1 mb-3 bg-[#22262C] border border-[#2A2F36] rounded-lg px-3 py-2 text-[#ECEEF0] text-sm" />
        <label className="text-xs text-[#8A93A0]">End (leave blank if still ongoing)</label>
        <input type="datetime-local" value={end} onChange={e => setEnd(e.target.value)}
          className="w-full mt-1 mb-4 bg-[#22262C] border border-[#2A2F36] rounded-lg px-3 py-2 text-[#ECEEF0] text-sm" />
        <div className="flex gap-2">
          <button onClick={() => onDelete(entry.id)} className="flex-1 py-2.5 rounded-xl border border-[#442] text-[#FF5A5A] flex items-center justify-center gap-1 text-sm"><Trash2 size={15} />Delete</button>
          <button onClick={() => onSave({ ...entry, status, start: fromLocalInput(start), end: end ? fromLocalInput(end) : null })}
            className="flex-1 py-2.5 rounded-xl text-[#14171A] font-medium text-sm" style={{ backgroundColor: '#F5A623' }}>Save</button>
        </div>
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* Main App                                                             */
/* ------------------------------------------------------------------ */
function App() {
  const [tab, setTab] = useState('dashboard');
  const [loaded, setLoaded] = useState(false);
  const [segments, setSegments] = useState([]);
  const [settings, setSettings] = useState({ gpsEnabled: true, compensations: {} });
  const [now, setNow] = useState(Date.now());
  const [gpsStatus, setGpsStatus] = useState('idle');
  const [speedKmh, setSpeedKmh] = useState(0);
  const [stopPrompt, setStopPrompt] = useState(null);
  const [dialOffset, setDialOffset] = useState(0);
  const [weekOffset, setWeekOffset] = useState(0);
  const [expandedDay, setExpandedDay] = useState(null);
  const [editEntry, setEditEntry] = useState(null);
  const [toast, setToast] = useState('');

  const segmentsRef = useRef([]);
  const lastPosRef = useRef(null);
  const speedEmaRef = useRef(null);
  const stoppedSinceRef = useRef(null);
  useEffect(() => { segmentsRef.current = segments; }, [segments]);

  /* ---- load from storage ---- */
  useEffect(() => {
    (async () => {
      let segs = [];
      try {
        const listRes = await storage.list('day:', false);
        const keys = listRes?.keys || [];
        for (const k of keys) {
          try {
            const r = await storage.get(k, false);
            if (r?.value) { const parsed = JSON.parse(r.value); segs.push(...(parsed.segments || [])); }
          } catch (e) { /* ignore missing */ }
        }
      } catch (e) { /* no data yet */ }
      let s = { gpsEnabled: true, compensations: {} };
      try { const r = await storage.get('settings', false); if (r?.value) s = { ...s, ...JSON.parse(r.value) }; } catch (e) { /* default */ }
      setSegments(segs);
      setSettings(s);
      setLoaded(true);
    })();
  }, []);

  /* ---- 1s tick ---- */
  useEffect(() => { const t = setInterval(() => setNow(Date.now()), 1000); return () => clearInterval(t); }, []);

  /* ---- persistence helpers ---- */
  async function persistDates(dates, allSegs) {
    for (const d of dates) {
      const daySegs = allSegs.filter(s => dateKey(s.start) === d);
      try { await storage.set('day:' + d, JSON.stringify({ segments: daySegs }), false); } catch (e) { setToast('Save failed — will retry'); }
    }
  }
  async function saveSettings(next) {
    setSettings(next);
    try { await storage.set('settings', JSON.stringify(next), false); } catch (e) { /* noop */ }
  }

  function switchStatus(newStatus, source, atTime) {
    const at = atTime || Date.now();
    const prev = segmentsRef.current;
    const next = [...prev];
    const touchedDates = new Set();
    if (next.length) {
      const last = next[next.length - 1];
      if (!last.end) {
        next[next.length - 1] = { ...last, end: new Date(at).toISOString() };
        touchedDates.add(dateKey(last.start));
      }
    }
    if (newStatus) {
      const seg = { id: uid(), status: newStatus, start: new Date(at).toISOString(), end: null, source };
      next.push(seg);
      touchedDates.add(dateKey(seg.start));
    }
    segmentsRef.current = next;
    setSegments(next);
    persistDates(touchedDates, next);
  }

  function saveEntry(updated) {
    const next = segmentsRef.current.map(s => s.id === updated.id ? updated : s);
    segmentsRef.current = next; setSegments(next);
    persistDates(new Set([dateKey(updated.start)]), next);
    setEditEntry(null);
  }
  function deleteEntry(id) {
    const target = segmentsRef.current.find(s => s.id === id);
    const next = segmentsRef.current.filter(s => s.id !== id);
    segmentsRef.current = next; setSegments(next);
    if (target) persistDates(new Set([dateKey(target.start)]), next);
    setEditEntry(null);
  }

  /* ---- GPS ---- */
  useEffect(() => {
    if (!loaded) return;
    if (!settings.gpsEnabled) { setGpsStatus('off'); return; }
    if (!('geolocation' in navigator)) { setGpsStatus('unsupported'); return; }
    setGpsStatus('waiting');
    const START = 2.5, STOP = 1.0; // m/s
    const watchId = navigator.geolocation.watchPosition(
      pos => {
        setGpsStatus('active');
        const t = pos.timestamp || Date.now();
        const raw = (pos.coords.speed != null && pos.coords.speed >= 0) ? pos.coords.speed : fallbackSpeed(lastPosRef.current, pos, t);
        lastPosRef.current = { lat: pos.coords.latitude, lng: pos.coords.longitude, t };
        const ema = speedEmaRef.current = speedEmaRef.current == null ? raw : speedEmaRef.current * 0.7 + raw * 0.3;
        setSpeedKmh(Math.max(0, ema * 3.6));

        const cur = segmentsRef.current[segmentsRef.current.length - 1];
        if (!cur || cur.status === 'daily_rest' || cur.status === 'weekly_rest') return;
        if (ema >= START) {
          stoppedSinceRef.current = null; setStopPrompt(null);
          if (cur.status !== 'driving') switchStatus('driving', 'gps', t);
        } else if (ema <= STOP && cur.status === 'driving') {
          if (!stoppedSinceRef.current) stoppedSinceRef.current = t;
          else if (t - stoppedSinceRef.current > 3 * MIN) setStopPrompt({ since: stoppedSinceRef.current });
        }
      },
      err => setGpsStatus(err.code === 1 ? 'denied' : 'error'),
      { enableHighAccuracy: true, maximumAge: 4000, timeout: 15000 }
    );
    return () => navigator.geolocation.clearWatch(watchId);
  }, [settings.gpsEnabled, loaded]);

  /* ---- derived ---- */
  const currentSegment = segments.length ? segments[segments.length - 1] : null;
  const currentStatus = currentSegment && !currentSegment.end ? currentSegment.status : 'off';
  const comp = useMemo(() => computeCompliance(segments, now), [segments, now]);

  const alerts = useMemo(() => {
    const a = [];
    if (currentStatus === 'driving' && comp.contDriving > RULES.maxContinuousDriving)
      a.push({ level: 'red', text: `Break overdue by ${fmtHM(comp.contDriving - RULES.maxContinuousDriving)} — 45 min needed` });
    if (comp.currentDutyDay.driving > RULES.dailyDriveExtended)
      a.push({ level: 'red', text: `Today's driving is past the 10h absolute daily max` });
    else if (comp.currentDutyDay.driving > RULES.dailyDriveNormal)
      a.push({ level: 'amber', text: `Extended driving day (9–10h) — one of your 2 weekly extensions` });
    if (comp.weekDriving > RULES.weeklyDriveMax) a.push({ level: 'red', text: `This week's driving is over the 56h limit` });
    if (comp.fortnightDriving > RULES.fortnightDriveMax) a.push({ level: 'red', text: `This + last week's driving is over the 90h fortnightly limit` });
    if (comp.reducedDailyCount > RULES.maxReducedDailyRestsPerCycle) a.push({ level: 'red', text: `More than 3 reduced daily rests since your last weekly rest` });
    if (comp.weeklyRestDeadline && now > comp.weeklyRestDeadline) a.push({ level: 'red', text: `Weekly rest overdue — should've started by ${fmtDateTime(comp.weeklyRestDeadline)}` });
    if (comp.backToBackReduced) a.push({ level: 'red', text: `Two reduced weekly rests back-to-back — next one must be a full 45h` });
    comp.compOwed.forEach(o => { if (!settings.compensations[o.id] && now > o.deadline) a.push({ level: 'red', text: `Rest compensation from ${fmtDate(o.date)} is overdue` }); });
    return a;
  }, [comp, currentStatus, now, settings.compensations]);

  if (!loaded) {
    return (
      <div className="min-h-screen flex items-center justify-center" style={{ background: '#14171A' }}>
        <span className="text-[#8A93A0] text-sm">Loading your log…</span>
      </div>
    );
  }

  return (
    <div className="min-h-screen pb-20" style={{ background: '#14171A', fontFamily: "'Inter',sans-serif" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');
        * { -webkit-tap-highlight-color: transparent; }
        select { appearance: none; }
      `}</style>

      {stopPrompt && (
        <StopPromptModal since={stopPrompt.since} now={now}
          onChoose={st => { switchStatus(st, 'manual', stopPrompt.since); setStopPrompt(null); stoppedSinceRef.current = null; }}
          onDismiss={() => { setStopPrompt(null); stoppedSinceRef.current = null; }} />
      )}
      {editEntry && <EditEntryModal entry={editEntry} onSave={saveEntry} onDelete={deleteEntry} onClose={() => setEditEntry(null)} />}

      {/* header */}
      <div className="px-4 pt-5 pb-3 flex items-center justify-between">
        <div className="flex items-center gap-2">
          <Truck size={20} color="#F5A623" />
          <span className="text-[#ECEEF0] tracking-wide" style={{ fontFamily: "'Oswald',sans-serif", fontWeight: 600, fontSize: 18 }}>HGV HOURS</span>
        </div>
        <button onClick={() => saveSettings({ ...settings, gpsEnabled: !settings.gpsEnabled })}
          className="flex items-center gap-1.5 px-2.5 py-1 rounded-full border border-[#2A2F36]">
          {settings.gpsEnabled ? <MapPin size={13} color={gpsStatus === 'active' ? '#3ECF6B' : '#F5A623'} /> : <MapPinOff size={13} color="#5B6470" />}
          <span className="text-[10px] text-[#8A93A0]">
            {!settings.gpsEnabled ? 'GPS off' : gpsStatus === 'active' ? `${speedKmh.toFixed(0)} km/h` : gpsStatus === 'denied' ? 'No access' : gpsStatus === 'unsupported' ? 'Unsupported' : 'Waiting…'}
          </span>
        </button>
      </div>

      {tab === 'dashboard' && (
        <DashboardTab
          now={now} segments={segments} comp={comp} alerts={alerts} currentStatus={currentStatus} currentSegment={currentSegment}
          dialOffset={dialOffset} setDialOffset={setDialOffset}
          onSwitch={st => switchStatus(st, 'manual')}
        />
      )}
      {tab === 'week' && (
        <WeekTab now={now} comp={comp} segments={segments} weekOffset={weekOffset} setWeekOffset={setWeekOffset}
          expandedDay={expandedDay} setExpandedDay={setExpandedDay} onEditEntry={setEditEntry}
          settings={settings} saveSettings={saveSettings} />
      )}
      {tab === 'rules' && <RulesTab />}
      {tab === 'settings' && <SettingsTab settings={settings} saveSettings={saveSettings} segments={segments} setSegments={setSegments} />}

      {toast && <div className="fixed top-2 left-1/2 -translate-x-1/2 bg-[#FF5A5A] text-white text-xs px-3 py-1.5 rounded-full z-50">{toast}</div>}

      {/* bottom nav */}
      <div className="fixed bottom-0 left-0 right-0 border-t border-[#2A2F36] flex" style={{ background: '#1B1F24' }}>
        {[
          ['dashboard', Gauge, 'Now'],
          ['week', Calendar, 'Week'],
          ['rules', BookOpen, 'Rules'],
          ['settings', SettingsIcon, 'Settings'],
        ].map(([key, Icon, label]) => (
          <button key={key} onClick={() => setTab(key)} className="flex-1 flex flex-col items-center gap-0.5 py-2.5">
            <Icon size={19} color={tab === key ? '#F5A623' : '#5B6470'} />
            <span className="text-[10px]" style={{ color: tab === key ? '#F5A623' : '#5B6470' }}>{label}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* Dashboard Tab                                                       */
/* ------------------------------------------------------------------ */
function DashboardTab({ now, comp, alerts, currentStatus, currentSegment, dialOffset, setDialOffset, onSwitch, segments }) {
  const meta = META[currentStatus];
  const Icon = meta.icon;
  const elapsed = currentSegment && !currentSegment.end ? now - new Date(currentSegment.start).getTime() : 0;
  const dayStart = fixedWeekStart === undefined ? 0 : (() => { const d = new Date(now + dialOffset * DAY); d.setHours(0, 0, 0, 0); return d.getTime(); })();
  const isToday = dialOffset === 0;

  let restPreview = '';
  if (currentStatus === 'daily_rest') {
    restPreview = elapsed >= RULES.dailyRestNormal ? 'Normal daily rest ✓'
      : elapsed >= RULES.dailyRestReducedMin ? 'Reduced daily rest — uses 1 of 3 allowed'
      : `${fmtHM(RULES.dailyRestReducedMin - elapsed)} more needed for a valid rest`;
  } else if (currentStatus === 'weekly_rest') {
    restPreview = elapsed >= RULES.weeklyRestNormal ? 'Regular weekly rest ✓'
      : elapsed >= RULES.weeklyRestReducedMin ? 'Reduced weekly rest — compensation will be owed'
      : `${fmtHM(RULES.weeklyRestReducedMin - elapsed)} more needed for a valid weekly rest`;
  }

  const remainingToday = Math.max(0, RULES.dailyDriveNormal - comp.currentDutyDay.driving);

  return (
    <div className="px-4">
      {alerts.length > 0 ? (
        <div className="mb-3 rounded-xl p-3 space-y-1.5" style={{ background: 'rgba(255,90,90,0.1)', border: '1px solid rgba(255,90,90,0.3)' }}>
          {alerts.map((a, i) => (
            <div key={i} className="flex items-start gap-2">
              <AlertTriangle size={14} color={a.level === 'red' ? '#FF5A5A' : '#F5A623'} className="mt-0.5 shrink-0" />
              <span className="text-xs" style={{ color: a.level === 'red' ? '#FF5A5A' : '#F5A623' }}>{a.text}</span>
            </div>
          ))}
        </div>
      ) : (
        <div className="mb-3 flex items-center gap-2 rounded-xl p-2.5" style={{ background: 'rgba(62,207,107,0.1)', border: '1px solid rgba(62,207,107,0.25)' }}>
          <CheckCircle2 size={14} color="#3ECF6B" />
          <span className="text-xs text-[#3ECF6B]">All tracked limits currently OK</span>
        </div>
      )}

      {/* status card */}
      <div className="rounded-2xl p-4 mb-4" style={{ background: '#1B1F24', border: '1px solid #2A2F36' }}>
        <div className="flex items-center gap-2 mb-1">
          <Icon size={16} color={meta.color} />
          <span className="text-xs text-[#8A93A0]">{currentSegment ? `since ${fmtClock(currentSegment.start)}` : 'not clocked on'}</span>
        </div>
        <div className="flex items-baseline justify-between">
          <span style={{ fontFamily: "'Oswald',sans-serif", fontWeight: 600, fontSize: 22, color: meta.color }}>{meta.label}</span>
          {currentSegment && !currentSegment.end && (
            <span style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 22, color: '#ECEEF0' }}>{fmtHMS(elapsed)}</span>
          )}
        </div>
        {restPreview && <div className="text-xs mt-1.5" style={{ color: meta.color }}>{restPreview}</div>}
        {currentStatus === 'driving' && (
          <div className="text-xs mt-1.5" style={{ color: comp.contDriving > RULES.maxContinuousDriving ? '#FF5A5A' : '#8A93A0' }}>
            {comp.contDriving > RULES.maxContinuousDriving
              ? `Break overdue by ${fmtHM(comp.contDriving - RULES.maxContinuousDriving)}`
              : `Break due in ${fmtHM(RULES.maxContinuousDriving - comp.contDriving)}`}
          </div>
        )}
        {(currentStatus === 'break' || currentStatus === 'other_work' || currentStatus === 'poa') && (
          <div className="text-xs mt-1.5 text-[#8A93A0]">
            Driving clock banked at {fmtHM(comp.contDriving)} · {fmtHM(remainingToday)} driving left today
          </div>
        )}
      </div>

      {/* status buttons */}
      <div className="grid grid-cols-2 gap-2 mb-5">
        {STATUS_GRID.map(st => {
          const m = META[st]; const active = currentStatus === st; const SIcon = m.icon;
          return (
            <button key={st} onClick={() => !active && onSwitch(st)}
              className="flex items-center gap-2.5 px-3 py-3 rounded-xl transition active:scale-95"
              style={{ background: active ? m.color : '#1B1F24', border: `1px solid ${active ? m.color : '#2A2F36'}` }}>
              <SIcon size={17} color={active ? '#14171A' : m.color} />
              <span className="text-sm font-medium" style={{ color: active ? '#14171A' : '#ECEEF0' }}>{m.short}</span>
            </button>
          );
        })}
      </div>

      {/* dial */}
      <div className="rounded-2xl p-4 mb-4" style={{ background: '#1B1F24', border: '1px solid #2A2F36' }}>
        <div className="flex items-center justify-between mb-2">
          <button onClick={() => setDialOffset(o => o - 1)}><ChevronLeft size={18} color="#8A93A0" /></button>
          <span className="text-xs text-[#ECEEF0] font-medium">{isToday ? 'Today' : fmtDate(dayStart)}</span>
          <button onClick={() => setDialOffset(o => Math.min(0, o + 1))} disabled={isToday}><ChevronRight size={18} color={isToday ? '#3A4048' : '#8A93A0'} /></button>
        </div>
        <Dial segments={segments.map(s => ({ ...s, _start: new Date(s.start).getTime(), _end: s.end ? new Date(s.end).getTime() : now, id: s.id }))}
          dayStart={dayStart} isToday={isToday} now={now} />
        <div className="flex flex-wrap gap-x-3 gap-y-1 justify-center mt-2">
          {STATUS_GRID.map(st => (
            <div key={st} className="flex items-center gap-1">
              <span className="w-2 h-2 rounded-full" style={{ background: META[st].color }} />
              <span className="text-[10px] text-[#8A93A0]">{META[st].short}</span>
            </div>
          ))}
        </div>
      </div>

      {/* gauges */}
      <div className="rounded-2xl p-4 mb-4" style={{ background: '#1B1F24', border: '1px solid #2A2F36' }}>
        <GaugeBar label="Today's driving" value={comp.currentDutyDay.driving} max={RULES.dailyDriveExtended} color="#F5A623" />
        <GaugeBar label="This week's driving" value={comp.weekDriving} max={RULES.weeklyDriveMax} color="#4C8DFF" />
        <GaugeBar label="Fortnight driving" value={comp.fortnightDriving} max={RULES.fortnightDriveMax} color="#2C56D6" />
        <div className="grid grid-cols-2 gap-2 mt-3">
          <Chip tone={comp.extendedDaysThisWeek >= 2 ? 'amber' : 'default'}>Extensions: {comp.extendedDaysThisWeek}/2</Chip>
          <Chip tone={comp.reducedDailyCount >= 3 ? 'amber' : 'default'}>Reduced rests: {comp.reducedDailyCount}/3</Chip>
        </div>
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* Week Tab                                                             */
/* ------------------------------------------------------------------ */
function WeekTab({ now, comp, segments, weekOffset, setWeekOffset, expandedDay, setExpandedDay, onEditEntry, settings, saveSettings }) {
  const base = fixedWeekStart(now) + weekOffset * 7 * DAY;
  const days = comp.dutyDaySummaries.filter(d => d.start && d.start >= base && d.start < base + 7 * DAY);

  return (
    <div className="px-4">
      <div className="flex items-center justify-between mb-4">
        <button onClick={() => setWeekOffset(o => o - 1)} className="p-1.5"><ChevronLeft size={18} color="#8A93A0" /></button>
        <span className="text-sm text-[#ECEEF0] font-medium">{fmtDate(base)} – {fmtDate(base + 6 * DAY)}</span>
        <button onClick={() => setWeekOffset(o => Math.min(0, o + 1))} disabled={weekOffset === 0}><ChevronRight size={18} color={weekOffset === 0 ? '#3A4048' : '#8A93A0'} /></button>
      </div>

      <div className="rounded-2xl p-4 mb-4" style={{ background: '#1B1F24', border: '1px solid #2A2F36' }}>
        <GaugeBar label="Driving this fixed week" value={weekOffset === 0 ? comp.weekDriving : sumWeek(days, 'driving')} max={RULES.weeklyDriveMax} color="#4C8DFF" />
        <GaugeBar label="Duty (driving + other work)" value={weekOffset === 0 ? comp.weekDuty : sumWeek(days, 'duty')} max={RULES.wtdWeeklyMax} extra="60h absolute / 48h avg target" color="#45C4B0" />
      </div>

      <div className="rounded-2xl p-4 mb-4" style={{ background: '#1B1F24', border: '1px solid #2A2F36' }}>
        <h3 className="text-xs uppercase tracking-wide text-[#8A93A0] mb-3">Duty periods</h3>
        {days.length === 0 && <p className="text-xs text-[#5B6470]">No entries this week.</p>}
        {days.map((d, i) => {
          const key = d.start;
          const expanded = expandedDay === key;
          const restCls = d.restAfter ? classifyLabel(d.restAfter, comp) : null;
          return (
            <div key={key} className="mb-2 border-b border-[#22262C] pb-2 last:border-0">
              <button onClick={() => setExpandedDay(expanded ? null : key)} className="w-full flex items-center justify-between py-1">
                <div className="text-left">
                  <div className="text-sm text-[#ECEEF0]">{fmtDate(d.start)}</div>
                  <div className="text-xs text-[#8A93A0]">Driving {fmtHM(d.driving)} · Duty {fmtHM(d.driving + d.otherWork)}</div>
                </div>
                <div className="flex items-center gap-2">
                  {restCls && <Chip tone={restCls.tone}>{restCls.text}</Chip>}
                  <ChevronRight size={16} color="#5B6470" style={{ transform: expanded ? 'rotate(90deg)' : 'none' }} />
                </div>
              </button>
              {expanded && (
                <div className="mt-2 space-y-1.5">
                  {d.segs.map(s => (
                    <button key={s.id} onClick={() => onEditEntry(s)} className="w-full flex items-center justify-between px-2.5 py-2 rounded-lg" style={{ background: '#22262C' }}>
                      <div className="flex items-center gap-2">
                        <span className="w-2 h-2 rounded-full" style={{ background: META[s.status].color }} />
                        <span className="text-xs text-[#ECEEF0]">{META[s.status].short}</span>
                      </div>
                      <div className="flex items-center gap-2">
                        <span className="text-xs text-[#8A93A0]" style={{ fontFamily: "'JetBrains Mono',monospace" }}>
                          {fmtClock(s.start)}–{s.end ? fmtClock(s.end) : '…'}
                        </span>
                        <Pencil size={12} color="#5B6470" />
                      </div>
                    </button>
                  ))}
                  {d.restAfter && (
                    <div className="w-full flex items-center justify-between px-2.5 py-2 rounded-lg" style={{ background: '#22262C' }}>
                      <div className="flex items-center gap-2">
                        <span className="w-2 h-2 rounded-full" style={{ background: META[d.restAfter.status].color }} />
                        <span className="text-xs text-[#ECEEF0]">{META[d.restAfter.status].short}</span>
                      </div>
                      <span className="text-xs text-[#8A93A0]" style={{ fontFamily: "'JetBrains Mono',monospace" }}>
                        {fmtClock(d.restAfter.start)}–{d.restAfter.end ? fmtClock(d.restAfter.end) : '…'}
                      </span>
                    </div>
                  )}
                </div>
              )}
            </div>
          );
        })}
      </div>

      <div className="rounded-2xl p-4 mb-4" style={{ background: '#1B1F24', border: '1px solid #2A2F36' }}>
        <h3 className="text-xs uppercase tracking-wide text-[#8A93A0] mb-3">Weekly rest status</h3>
        <div className="flex justify-between text-sm mb-1"><span className="text-[#8A93A0]">Last weekly rest ended</span><span className="text-[#ECEEF0]">{comp.lastWeeklyRestEnd ? fmtDateTime(comp.lastWeeklyRestEnd) : 'none logged'}</span></div>
        {comp.weeklyRestDeadline && (
          <div className="flex justify-between text-sm mb-1">
            <span className="text-[#8A93A0]">Next weekly rest due by</span>
            <span style={{ color: now > comp.weeklyRestDeadline ? '#FF5A5A' : '#ECEEF0' }}>{fmtDateTime(comp.weeklyRestDeadline)}</span>
          </div>
        )}
        {comp.backToBackReduced && <div className="mt-2 text-xs text-[#FF5A5A]">Two reduced weekly rests in a row detected — the next one must be a full 45h.</div>}

        {comp.compOwed.length > 0 && (
          <div className="mt-3 pt-3 border-t border-[#22262C] space-y-2">
            <span className="text-xs text-[#8A93A0]">Reduced-rest compensation owed</span>
            {comp.compOwed.map(o => {
              const done = !!settings.compensations[o.id];
              const overdue = !done && now > o.deadline;
              return (
                <div key={o.id} className="flex items-center justify-between">
                  <div>
                    <div className="text-xs text-[#ECEEF0]">{fmtHM(o.owedMs)} from {fmtDate(o.date)}</div>
                    <div className="text-[10px]" style={{ color: overdue ? '#FF5A5A' : '#5B6470' }}>by {fmtDate(o.deadline)}{overdue ? ' — overdue' : ''}</div>
                  </div>
                  <button onClick={() => saveSettings({ ...settings, compensations: { ...settings.compensations, [o.id]: !done } })}
                    className="text-[10px] px-2 py-1 rounded-md" style={{ background: done ? 'rgba(62,207,107,0.15)' : '#22262C', color: done ? '#3ECF6B' : '#8A93A0' }}>
                    {done ? 'Compensated ✓' : 'Mark done'}
                  </button>
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}
function sumWeek(days, kind) { return days.reduce((sum, d) => sum + (kind === 'driving' ? d.driving : d.driving + d.otherWork), 0); }
function classifyLabel(restSeg, comp) {
  if (restSeg.status === 'weekly_rest') {
    const found = comp.weeklyRestSegs.find(w => w.seg.id === restSeg.id);
    if (!found) return { tone: 'default', text: 'ongoing' };
    return found.cls === 'regular' ? { tone: 'green', text: 'Regular weekly' } : found.cls === 'reduced' ? { tone: 'amber', text: 'Reduced weekly' } : { tone: 'red', text: 'Too short' };
  }
  const found = comp.dailyRestClassified.find(c => c.seg.id === restSeg.id);
  if (!found) return { tone: 'default', text: 'ongoing' };
  return found.cls === 'normal' ? { tone: 'green', text: 'Normal rest' } : found.cls === 'split' ? { tone: 'blue', text: 'Split rest' } : found.cls === 'reduced' ? { tone: 'amber', text: 'Reduced rest' } : { tone: 'red', text: 'Too short' };
}

/* ------------------------------------------------------------------ */
/* Rules Tab                                                            */
/* ------------------------------------------------------------------ */
function RuleSection({ title, children }) {
  return (
    <div className="rounded-2xl p-4 mb-3" style={{ background: '#1B1F24', border: '1px solid #2A2F36' }}>
      <h3 className="text-sm font-semibold mb-2" style={{ fontFamily: "'Oswald',sans-serif", color: '#F5A623' }}>{title}</h3>
      <div className="text-sm text-[#C7CCD1] space-y-1.5 leading-relaxed">{children}</div>
    </div>
  );
}
function RulesTab() {
  return (
    <div className="px-4">
      <div className="rounded-xl p-3 mb-4 flex gap-2" style={{ background: 'rgba(76,141,255,0.1)', border: '1px solid rgba(76,141,255,0.25)' }}>
        <Info size={15} color="#4C8DFF" className="shrink-0 mt-0.5" />
        <p className="text-xs text-[#4C8DFF]">Covers the assimilated EU/GB drivers' hours rules (Regulation 561/2006, as retained in UK law) and the Road Transport Working Time Regulations 2005 — the framework that applies to most solo UK HGV driving over 3.5t. GB domestic rules for exempt vehicles and multi-manning aren't covered.</p>
      </div>

      <RuleSection title="Driving limits">
        <p>9 hours' driving per day, extendable to 10 hours on up to 2 days in any fixed week (Mon 00:00–Sun 24:00).</p>
        <p>56 hours max driving in a single fixed week.</p>
        <p>90 hours max across any two consecutive fixed weeks.</p>
      </RuleSection>

      <RuleSection title="Breaks">
        <p>At least 45 minutes after 4.5 hours' continuous driving.</p>
        <p>Can be split: 15 minutes first, then 30 minutes later — in that order — before the 4.5h is up.</p>
        <p>Other work and POA don't reset the 4.5h driving clock — only a qualifying break or rest does.</p>
      </RuleSection>

      <RuleSection title="Daily rest">
        <p>Normally at least 11 consecutive hours.</p>
        <p>Reducible to a minimum of 9 hours, up to 3 times between two weekly rests — no compensation owed.</p>
        <p>Or split: 3 hours + 9 hours (in that order), totalling at least 12h within 24h — this counts as a normal rest, not a reduction.</p>
      </RuleSection>

      <RuleSection title="Weekly rest">
        <p>Normally at least 45 consecutive hours.</p>
        <p>Reducible to a minimum of 24 hours once between two regular weekly rests — never two reduced rests back-to-back.</p>
        <p>Any shortfall must be repaid in one block, attached to another rest of at least 9h, by the end of the 3rd week following the reduction.</p>
        <p>A new weekly rest must start no later than 144 hours (6×24h) after the previous one ended.</p>
        <p>A regular (45h+) weekly rest can't be taken in the cab.</p>
      </RuleSection>

      <RuleSection title="Working Time Directive">
        <p>Average 48-hour working week over a 17-week reference period; 60 hours absolute max in any single week.</p>
        <p>Working time = driving + other work. It excludes breaks, POA and rest.</p>
        <p>Night work (any duty falling between 00:00–04:00): max 10 hours' working time in the 24h period starting when your working week begins, unless a workforce agreement extends this.</p>
      </RuleSection>

      <RuleSection title="Period of Availability (POA)">
        <p>A known-in-advance waiting period (e.g. waiting for a loading slot) where you're not working but must stay available.</p>
        <p>Not driving time, not working time, not a break, not rest — and it doesn't reset your 4.5h driving clock.</p>
      </RuleSection>

      <div className="rounded-xl p-3 mb-6" style={{ background: '#1B1F24', border: '1px solid #2A2F36' }}>
        <p className="text-xs text-[#5B6470]">This is a simplified guide, not legal advice. Your digital tachograph remains your legal record. For full detail see DVSA's "Drivers' hours and tachographs" guidance on GOV.UK.</p>
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* Settings Tab                                                        */
/* ------------------------------------------------------------------ */
function SettingsTab({ settings, saveSettings, segments, setSegments }) {
  const [confirmReset, setConfirmReset] = useState(false);

  function exportCsv() {
    const rows = [['Status', 'Start', 'End', 'Duration', 'Source']];
    [...segments].sort((a, b) => new Date(a.start) - new Date(b.start)).forEach(s => {
      const dur = (s.end ? new Date(s.end) : new Date()) - new Date(s.start);
      rows.push([META[s.status]?.label || s.status, s.start, s.end || '', fmtHM(dur), s.source]);
    });
    const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `hgv-hours-log-${dateKey(Date.now())}.csv`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  async function resetAll() {
    try {
      const listRes = await storage.list('day:', false);
      for (const k of (listRes?.keys || [])) { try { await storage.delete(k, false); } catch (e) {} }
      await storage.delete('settings', false);
    } catch (e) {}
    setSegments([]);
    saveSettings({ gpsEnabled: true, compensations: {} });
    setConfirmReset(false);
  }

  return (
    <div className="px-4">
      <div className="rounded-2xl p-4 mb-4" style={{ background: '#1B1F24', border: '1px solid #2A2F36' }}>
        <h3 className="text-xs uppercase tracking-wide text-[#8A93A0] mb-3">GPS</h3>
        <div className="flex items-center justify-between">
          <div>
            <div className="text-sm text-[#ECEEF0]">Auto-detect driving</div>
            <div className="text-xs text-[#5B6470] mt-0.5">Starts a Driving entry automatically when moving, and asks you to classify a stop after ~3 minutes stationary.</div>
          </div>
          <button onClick={() => saveSettings({ ...settings, gpsEnabled: !settings.gpsEnabled })}
            className="w-11 h-6 rounded-full shrink-0 ml-3 relative transition" style={{ background: settings.gpsEnabled ? '#F5A623' : '#2A2F36' }}>
            <span className="absolute top-0.5 w-5 h-5 rounded-full bg-white transition-all" style={{ left: settings.gpsEnabled ? 22 : 2 }} />
          </button>
        </div>
        <p className="text-xs text-[#5B6470] mt-3">If location access isn't available in this preview, everything still works with the manual buttons on the Now tab. For live GPS, open this app in your phone's browser (share/open-in-browser) so it can request location permission.</p>
      </div>

      <div className="rounded-2xl p-4 mb-4" style={{ background: '#1B1F24', border: '1px solid #2A2F36' }}>
        <h3 className="text-xs uppercase tracking-wide text-[#8A93A0] mb-3">Your data</h3>
        <p className="text-xs text-[#5B6470] mb-3">Stored privately on your account for this app only — not shared with anyone else.</p>
        <button onClick={exportCsv} className="w-full flex items-center justify-center gap-2 py-2.5 rounded-xl mb-2" style={{ background: '#22262C', color: '#ECEEF0' }}>
          <Download size={15} /> Export full log as CSV
        </button>
        {!confirmReset ? (
          <button onClick={() => setConfirmReset(true)} className="w-full flex items-center justify-center gap-2 py-2.5 rounded-xl border border-[#442]" style={{ color: '#FF5A5A' }}>
            <Trash2 size={15} /> Reset all data
          </button>
        ) : (
          <div className="rounded-xl p-3" style={{ background: 'rgba(255,90,90,0.1)' }}>
            <p className="text-xs text-[#FF5A5A] mb-2">This deletes every logged entry permanently. Are you sure?</p>
            <div className="flex gap-2">
              <button onClick={() => setConfirmReset(false)} className="flex-1 py-2 rounded-lg text-xs" style={{ background: '#22262C', color: '#8A93A0' }}>Cancel</button>
              <button onClick={resetAll} className="flex-1 py-2 rounded-lg text-xs text-white" style={{ background: '#FF5A5A' }}>Yes, delete everything</button>
            </div>
          </div>
        )}
      </div>

      <div className="rounded-2xl p-4 mb-6" style={{ background: '#1B1F24', border: '1px solid #2A2F36' }}>
        <h3 className="text-xs uppercase tracking-wide text-[#8A93A0] mb-2">Disclaimer</h3>
        <p className="text-xs text-[#5B6470] leading-relaxed">A personal aid to help you understand and track your hours — not a certified tachograph record and not legal advice. Your digital tachograph and VU/card downloads remain your official legal record for DVSA and your employer. Built for single-driver, UK, assimilated EU/GB rules only.</p>
      </div>
    </div>
  );
}

const rootEl = document.getElementById('root');
ReactDOM.createRoot(rootEl).render(React.createElement(App));

</script>
