/* localStorage-backed storage shim (same API as the Claude artifact)  */
/* ------------------------------------------------------------------ */
const STORAGE_PREFIX = 'hgvhours:';
const storage = {
    async get(key) {
        const raw = localStorage.getItem(STORAGE_PREFIX + key);
        if (raw === null)
            throw new Error('not found');
        return { key, value: raw };
    },
    async set(key, value) {
        localStorage.setItem(STORAGE_PREFIX + key, value);
        return { key, value };
    },
    async delete(key) {
        localStorage.removeItem(STORAGE_PREFIX + key);
        return { key, deleted: true };
    },
    async list(prefix) {
        const p = STORAGE_PREFIX + (prefix || '');
        const keys = [];
        for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (k && k.startsWith(p))
                keys.push(k.slice(STORAGE_PREFIX.length));
        }
        return { keys };
    },
};

<script>
/* ------------------------------------------------------------------ *
 * Dependency loader with an offline cache.                            *
 * React is fetched once, stored in localStorage, and re-used from     *
 * there on every later load — so the app opens with no signal.        *
 * ------------------------------------------------------------------ */
(function () {
  var LIB = 'hgvhours:lib:';
  var DEPS = [
    { key: 'react-18', url: 'https://unpkg.com/react@18/umd/react.production.min.js' },
    { key: 'react-dom-18', url: 'https://unpkg.com/react-dom@18/umd/react-dom.production.min.js' }
  ];
  function exec(code) {
    var el = document.createElement('script');
    el.text = code;
    document.head.appendChild(el);
  }
  function cached(key) {
    try { return localStorage.getItem(LIB + key); } catch (e) { return null; }
  }
  function store(key, code) {
    try { localStorage.setItem(LIB + key, code); } catch (e) { /* quota — run anyway */ }
  }
  function startApp() {
    var src = document.getElementById('app-src');
    if (!src) { showBootError('App source block is missing.'); return; }
    try {
      exec(src.textContent);
    } catch (e) {
      showBootError('App failed to start:\n' + (e && e.message ? e.message : e));
    }
  }
  function step(i) {
    if (i >= DEPS.length) { startApp(); return; }
    var d = DEPS[i], hit = cached(d.key);
    if (hit) {
      try { exec(hit); step(i + 1); return; }
      catch (e) { try { localStorage.removeItem(LIB + d.key); } catch (e2) {} }
    }
    fetch(d.url)
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(function (code) { store(d.key, code); exec(code); step(i + 1); })
      .catch(function () {
        showBootError('Could not load ' + d.key + ', and nothing is cached yet.\n\n'
          + 'Open the app once while you have signal. After that it works offline.');
      });
  }
  step(0);
})();
</script>
